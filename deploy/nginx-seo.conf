# Add inside the `server { ... }` block of /etc/nginx/sites-enabled/hambox, next to `location = /health`.
# The API builds both files from the live catalogue and the SEO platform settings (audit R54).
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:5000/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=600" always;
}

location = /robots.txt {
    proxy_pass http://127.0.0.1:5000/robots.txt;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=3600" always;
}
