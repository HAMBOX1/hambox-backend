services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  # Optional job-queue wake-up transport (IJobQueueNotifier) — a pure latency optimization on top of
  # the durable, DB-polled OperationalJob queue. Not exposed on a host port: only hambox-api's own
  # container network can reach it, matching how it must be run in production (never publicly exposed,
  # see docs/PRODUCTION_REDIS.md). If this container is stopped, the app keeps working correctly at
  # its normal DB-polling interval — nothing here is load-bearing for correctness.
  redis:
    image: redis:7-alpine
    container_name: hambox-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  hambox-api:
    image: hambox-api
    container_name: hambox-api
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__Database=Server=sqlserver,1433;Database=${DB_NAME};User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=HamboxAuth
      - JwtSettings__Audience=HamboxWebAPI
      - EmailSettings__Enabled=true
      - EmailSettings__SmtpHost=mailpit
      - EmailSettings__SmtpPort=1025
      - EmailSettings__UseSsl=false
      - EmailSettings__FromAddress=noreply@hambox.local
      - EmailSettings__FromName=HAMBOX
      - EmailSettings__ApplicationBaseUrl=http://localhost:4200
      - Redis__ConnectionString=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
